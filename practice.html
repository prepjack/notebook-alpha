<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice — Study Notebook</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="index-directory-page practice-page">

    <header class="app-header">
        <h1>Practice</h1>
        <div class="header-subjects">
            <a href="index.html" class="subject-add-button practice-link">← Home</a>
            <button id="progress-sync-btn" type="button" class="subject-add-button progress-sync-btn" data-state="new" title="Progress sync & backup">⟳ Sync</button>
        </div>
    </header>

    <main id="practice-shell" class="practice-shell">
        <section id="practice-workspace" class="practice-workspace">

            <!-- LEFT: what to look at -->
            <aside id="practice-left" class="panel practice-left">
                <div class="panel-heading-row">
                    <div class="panel-heading">PRACTICE</div>
                    <button type="button" id="practice-toggle" class="panel-collapse-btn"
                            title="Collapse menu" aria-label="Collapse menu" aria-expanded="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                    </button>
                </div>

                <div id="practice-resizer" class="panel-resizer"
                     title="Drag this RIGHT edge left/right to resize"></div>

                <nav id="practice-menu" class="practice-menu" aria-label="Practice sections">
                    <button type="button" class="practice-menu-item" data-group="progress">
                        <span>Progress</span><span class="practice-menu-badge" id="practice-badge-progress" hidden></span>
                    </button>
                    <div class="practice-submenu" id="practice-submenu" hidden>
                        <button type="button" class="practice-submenu-item" data-view="tree">Tree view</button>
                        <button type="button" class="practice-submenu-item" data-view="due">Due view</button>
                    </div>
                    <button type="button" class="practice-menu-item" data-view="flashcards">
                        <span>Flashcards</span><span class="practice-menu-badge" id="practice-badge-flashcards" hidden></span>
                    </button>
                    <button type="button" class="practice-menu-item" data-view="mcq">
                        <span>MCQs</span>
                    </button>
                </nav>
            </aside>

            <!-- RIGHT: shows whatever was picked on the left -->
            <section id="practice-right" class="panel practice-right">
                <div class="panel-heading-row">
                    <button type="button" id="practice-back" class="practice-back">← Menu</button>
                    <div class="panel-heading" id="practice-right-heading">PROGRESS · DUE VIEW</div>
                </div>
                <div id="practice-message" class="practice-message" role="status" aria-live="polite" hidden></div>

                <div id="pv-due" class="practice-view" hidden></div>
                <div id="pv-tree" class="practice-view" hidden></div>
                <div id="pv-flashcards" class="practice-view" hidden></div>
                <div id="pv-mcq" class="practice-view" hidden></div>
            </section>

        </section>
    </main>

    <footer class="app-footer">
        <div class="app-footer-inner">
            <div class="app-footer-brand">
                <div class="app-footer-logo">Notebook</div>
                <div class="app-footer-tagline">A focused space for learning, revision, and practice.</div>
            </div>
            <nav class="app-footer-nav" aria-label="Footer navigation">
                <a href="index.html">Home</a>
                <a href="index-directory.html">Index</a>
                <a href="mcq.html">MCQ Practice</a>
                <span class="app-footer-current" aria-current="page">Practice</span>
            </nav>
            <div class="app-footer-copy">© 2026 Notebook.</div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <script src="data/study-data.js"></script>
    <script src="js/progress-sync.js"></script>
    <script src="js/flashcards.js"></script>
    <script src="js/practice.js"></script>
</body>
</html>
