<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index — Study Notebook</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="index-directory-page">

    <header class="app-header">
        <h1>Index</h1>
    </header>

    <main class="index-directory-shell">
        <section id="index-directory-workspace" class="index-directory-workspace">

            <!-- LEFT: search + room for future index tools -->
            <aside id="index-left-panel" class="panel index-directory-left">
                <div class="panel-heading-row">
                    <div class="panel-heading">SEARCH INDEX</div>
                    <button type="button" id="index-directory-toggle" class="panel-collapse-btn"
                            title="Collapse search panel" aria-label="Collapse search panel"
                            aria-expanded="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                    </button>
                </div>

                <div id="index-directory-resizer" class="panel-resizer"
                     title="Drag this RIGHT edge left/right to resize"></div>

                <div class="index-search-wrap">
                    <input type="text" id="index-directory-search" class="index-search-input"
                           placeholder="Search the index... e.g. bibli" autocomplete="off">
                </div>

                <div id="index-directory-count" class="index-directory-count"></div>

                <!-- MORE TOOLS is the umbrella section for this panel —
                     each tool inside it (starting with Browse & Filter)
                     is its own collapsible block, so future tools can
                     be added here without the panel growing unbounded. -->
                <div class="index-directory-more">
                    <div class="index-directory-more-title">MORE TOOLS</div>

                    <div class="index-tool-accordion">
                        <button type="button" id="browse-filter-toggle" class="index-tool-accordion-header"
                                aria-expanded="true" aria-controls="browse-filter-body">
                            <span class="index-tool-accordion-chevron" aria-hidden="true">▾</span>
                            <span>Browse &amp; Filter</span>
                        </button>
                        <div id="browse-filter-body" class="index-tool-accordion-body">
                            <div class="index-sort-toggle" role="tablist" aria-label="Index sort order">
                                <button type="button" class="index-sort-btn active" data-index-sort="az"
                                        title="List every term alphabetically">A-Z View</button>
                                <button type="button" class="index-sort-btn" data-index-sort="hierarchy"
                                        title="Group terms by Subject → Course → Unit → Chapter">Tree View</button>
                            </div>
                            <p id="index-sort-caption" class="index-sort-caption">Terms listed alphabetically, A to Z.</p>

                            <div class="index-scope-filter">
                                <div class="index-scope-filter-title">Browse by Subject</div>
                                <select id="scope-subject" class="index-scope-select">
                                    <option value="">Subject…</option>
                                </select>
                                <select id="scope-course" class="index-scope-select" disabled>
                                    <option value="">Course…</option>
                                </select>
                                <select id="scope-unit" class="index-scope-select" disabled>
                                    <option value="">Unit…</option>
                                </select>
                                <select id="scope-chapter" class="index-scope-select" disabled>
                                    <option value="">Chapter…</option>
                                </select>
                                <div class="index-scope-actions">
                                    <button type="button" id="scope-view-tree-btn" class="index-scope-clear-btn" hidden>View in Tree</button>
                                    <button type="button" id="scope-clear-btn" class="index-scope-clear-btn" hidden>Clear scope</button>
                                </div>
                                <div id="scope-term-count" class="index-scope-count"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- RIGHT: every index term, multi-column, scrollable -->
            <section id="index-directory-right-panel" class="panel index-directory-right">
                <div class="panel-heading-row">
                    <div class="panel-heading">ALL INDEX TERMS</div>
                    <div class="index-directory-right-controls">
                        <button type="button" id="index-directory-refresh" class="index-directory-refresh-btn"
                                title="Refresh index" aria-label="Refresh index">⟳</button>
                    </div>
                </div>
                <div id="index-directory-columns" class="index-directory-columns"></div>
                <div id="index-directory-hierarchy" class="index-directory-hierarchy" hidden></div>
            </section>

        </section>
    </main>

    <footer class="app-footer">Study Notes</footer>

    <script src="data/study-data.js"></script>
    <script src="js/index-data.js"></script>
    <script src="js/index-directory.js"></script>
</body>
</html>
