<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Practice — Study Notebook</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="mcq-page">

    <header class="app-header">
        <h1>MCQ Practice</h1>

        <div class="mcq-setup">
            <div class="mcq-setup-title">
                <span>ATTEMPT SETTINGS</span>
                <button id="mcq-add-open" type="button" class="content-action">➕ Add MCQs</button>
                <button id="mcq-paper-sources-btn" type="button" class="content-action" hidden>📄 Paper Sources</button>
            </div>
        <div class="mcq-display-controls" aria-label="Display controls">
            <span class="mcq-display-label">Text</span>
            <button type="button" id="mcq-font-down" title="Decrease text size">A−</button>
            <button type="button" id="mcq-font-up" title="Increase text size">A+</button>
            <label class="mcq-language-label" for="mcq-language">Language</label>
            <select id="mcq-language" title="Language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>
        </div>


            <label>
                Timer
                <select id="mcq-timer-mode">
                    <option value="none">No timer</option>
                    <option value="10">10 minutes</option>
                    <option value="20">20 minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="60">60 minutes</option>
                </select>
            </label>

            <label>
                Correct
                <input id="mark-correct" type="number" value="1" step="0.25">
            </label>

            <label>
                Wrong
                <input id="mark-wrong" type="number" value="0" step="0.25">
            </label>

            <button id="mcq-start" type="button">Start Attempt</button>
            <div id="mcq-timer-display" class="mcq-timer-display">No timer</div>
        </div>
    </header>

    <div id="mcq-paper-sources-popover" class="mcq-paper-sources-popover" hidden></div>

    <main id="mcq-page-root" class="app-shell">

        <div class="mcq-workspace">

            <div class="mcq-main-column">
            <div class="mcq-question-area">
                <div class="mcq-view-title">
                    <span>MCQ PRACTICE</span>
                    <div class="mcq-view-mode-switch">
                        <button id="mcq-view-single-btn" type="button" class="content-action active">Single View</button>
                        <button id="mcq-view-all-btn" type="button" class="content-action">All Questions</button>
                    </div>
                </div>
                <div id="mcq-collection-notes"></div>
                <div id="mcq-question"></div>
            </div>

            <div id="mcq-action-strip" class="mcq-action-strip">
                <div id="mcq-question-footer" class="mcq-question-footer"></div>
            </div>
            </div>

            <aside id="mcq-navigator" class="mcq-navigator">
                <div class="mcq-nav-header">
                    <span class="mcq-nav-title">QUESTIONS</span>
                    <div class="mcq-nav-header-actions">
                        <button id="mcq-nav-width-toggle" type="button"
                                class="mcq-nav-width-toggle panel-width-toggle"
                                title="Expand question navigator to half workspace width"
                                aria-label="Expand question navigator to half workspace width"
                                aria-pressed="false">⇔</button>
                        <button id="mcq-nav-toggle" type="button"
                                class="mcq-nav-toggle" title="Collapse question navigator">›</button>
                    </div>
                </div>
                <div class="mcq-nav-body">
                    <div class="mcq-nav-summary">
                        <span><strong id="mcq-nav-total">0</strong> Questions</span>
                        <span class="mcq-nav-legend">
                            <i class="legend-dot unanswered"></i> Not attempted
                            <i class="legend-dot attempted"></i> Attempted
                        </span>
                    </div>
                    <div id="mcq-question-grid"></div>
                </div>
                <div class="mcq-nav-submit">
                    <button id="mcq-submit" type="button" class="mcq-submit">Submit Attempt</button>
                </div>
            </aside>

        </div>


        <section id="mcq-result" class="mcq-result" hidden>
            <div class="result-title">RESULT</div>
            <div id="result-summary"></div>
            <div id="result-details"></div>
            <button id="mcq-retry" type="button">New Attempt</button>
        </section>

    </main>

    <footer class="app-footer">
    <div class="app-footer-inner">
        <div class="app-footer-brand">
            <div class="app-footer-logo">Notebook</div>
            <div class="app-footer-tagline">A focused space for learning, revision, and practice.</div>
        </div>
        <nav class="app-footer-nav" aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="index-directory.html">Index</a>
            <a href="revision.html">Revision</a>
            <a href="practice.html">Practice</a>
            <span class="app-footer-current" aria-current="page">MCQ Practice</span>
        </nav>
        <div class="app-footer-copy">© 2026 Notebook.</div>
    </div>
</footer>

    <script src="js/mcq-parse.js"></script>
    <script src="js/app.js"></script>
    <script src="js/mcq.js"></script>
</body>
</html>
