<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moved to Practice</title>
    <!-- The Revision page became "Practice" (Progress view). Old links and
         bookmarks land here and are forwarded, keeping ?topic=<id>. -->
    <meta http-equiv="refresh" content="0; url=practice.html?view=due">
    <script>
        (function () {
            var topic = "";
            try { topic = new URLSearchParams(location.search).get("topic") || ""; } catch (e) {}
            location.replace("practice.html?view=due" + (topic ? "&topic=" + encodeURIComponent(topic) : ""));
        })();
    </script>
</head>
<body>
    <p>The Revision page is now <a href="practice.html?view=due">Practice</a>.</p>
</body>
</html>
